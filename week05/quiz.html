<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Web Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <h1>Basic Web Quiz</h1>

    <form action="#" method="get">

        <div>
            <label for="q1">1. What does the acronym HTML stand for?</label>
            <input type="text" id="q1" name="q1">
        </div>

        <div>
            <label for="q2">2. In your own words, what is the purpose of a label element?</label>
            <textarea id="q2" name="q2" rows="3"></textarea>
        </div>

        <div>
            <label for="q10">3. Which tag creates the largest heading?</label>
            <select id="q10" name="q10">
                <option value="" selected disabled>Choose One ...</option>
                <option value="h6">&lt;h6&gt;</option>
                <option value="h1">&lt;h1&gt;</option>
                <option value="head">&lt;head&gt;</option>
            </select>
        </div>

        <div>
            <label for="q4">4. How many sides does the box model's margin surround?</label>
            <input type="number" id="q4" name="q4">
        </div>

        <button type="submit">Submit Quiz</button>

    </form>
</body>

</html>
